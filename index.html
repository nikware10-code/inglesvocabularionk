<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inglés Vocabulario NK</title>
<meta name="description" content="Aprende vocabulario de inglés de 3º ESO con repaso espaciado, ejercicios y juegos. by NIKWARE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap">
<style>
/* ====== Colores y base ====== */
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2433; --muted:#6b7385; --line:#e6e2d8;
  --brand:#ff6b35; --brand2:#2f6fed; --ok:#1fa463; --ko:#e5484d; --warn:#f5a524;
  --u1:#8cc63f; --u2:#f7941d; --u3:#e6007e; --u4:#8cc63f; --u5:#f26522; --u6:#e6007e; --u7:#8cc63f; --u8:#f7941d; --u9:#e5262b;
  --radius:18px; --shadow:0 2px 0 rgba(0,0,0,.06), 0 8px 24px rgba(29,36,51,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171f; --card:#1d2230; --ink:#eef1f7; --muted:#9aa3b5; --line:#2c3344; --shadow:0 2px 0 rgba(0,0,0,.3); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,Segoe UI,sans-serif;font-size:17px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand2)}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
h1,h2,h3{margin:0 0 8px;line-height:1.15}
h1{font-weight:900;font-size:28px} h2{font-weight:900;font-size:22px} h3{font-weight:800;font-size:18px}
.muted{color:var(--muted)} .small{font-size:14px} .center{text-align:center}
.row{display:flex;gap:10px;align-items:center} .row.wrap{flex-wrap:wrap} .grow{flex:1}
.stack>*+*{margin-top:12px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:800;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);transition:transform .05s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 0 #c94d20}
.btn.blue{background:var(--brand2);border-color:var(--brand2);color:#fff;box-shadow:0 4px 0 #1f4fb5}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 0 #13774a}
.btn.ko{background:var(--ko);border-color:var(--ko);color:#fff;box-shadow:0 4px 0 #a92d31}
.btn.block{width:100%} .btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;background:var(--card);border:2px solid var(--line)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:14px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--line);color:var(--ink)}
.chip.book{background:#ffe3d6;color:#a2401a} .chip.extra{background:#dfe9ff;color:#1f4fb5}
.chip.new{background:var(--line)} .chip.learning{background:#fff1cc;color:#8a5a00} .chip.mastered{background:#d6f5e4;color:#0f6b3f}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#ffb347);border-radius:99px;transition:width .4s}
.bar.blue>i{background:linear-gradient(90deg,var(--brand2),#6fb1ff)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{text-align:center;padding:14px}
.stat b{display:block;font-size:26px;font-weight:900}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
/* ====== Perfiles ====== */
.profile{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.avatar{width:54px;height:54px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avatars button{font-size:28px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.avatars button.sel{border-color:var(--brand);background:#fff1ea}
/* ====== Tarjeta de palabra ====== */
.word-card{text-align:center;padding:26px 20px}
.word-card .emoji{font-size:64px;line-height:1}
.word-card .en{font-size:34px;font-weight:900;margin-top:8px;word-break:break-word}
.word-card .pron{color:var(--muted);font-weight:700}
.word-card .es{font-size:22px;font-weight:800;color:var(--brand2);margin-top:6px}
.example{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:14px;text-align:left}
.example mark{background:#ffe08a;color:#1d2433;border-radius:4px;padding:0 3px}
.tip{border-radius:14px;padding:12px 14px;margin-top:10px;text-align:left;background:#fff6dc;color:#5b4300}
.tip.warn{background:#ffe4e4;color:#7c1d20}
@media (prefers-color-scheme: dark){ .tip{background:#3a3220;color:#ffe9a8} .tip.warn{background:#3d2224;color:#ffc9cb} .avatars button.sel{background:#3a2a22} }
/* ====== Ejercicios ====== */
.q-head{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.q-word{font-size:32px;font-weight:900;margin:6px 0 2px;word-break:break-word}
.options{display:grid;gap:10px;margin-top:16px}
.option{padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;text-align:left;box-shadow:0 3px 0 var(--line)}
.option.right{border-color:var(--ok);background:#dcf7e8;color:#0f6b3f}
.option.wrong{border-color:var(--ko);background:#ffe1e2;color:#8f1d22}
.feedback{margin-top:14px;padding:14px;border-radius:14px;font-weight:700}
.feedback.ok{background:#dcf7e8;color:#0f6b3f} .feedback.ko{background:#ffe1e2;color:#8f1d22}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grade .btn{flex-direction:column;gap:2px;padding:10px 6px;font-size:15px}
.grade .btn small{font-weight:600;font-size:11px;opacity:.85}
.progress-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.xp-pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-weight:900;font-size:26px;color:var(--brand);pointer-events:none;animation:pop 0.9s ease-out forwards;z-index:50}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
/* ====== Lista de palabras ====== */
.wlist{display:grid;gap:6px}
.witem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.witem .e{font-size:22px;width:28px;text-align:center}
details.theme{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:4px 12px}
details.theme summary{cursor:pointer;padding:10px 0;font-weight:800;display:flex;align-items:center;gap:8px}
details.theme[open]{padding-bottom:12px}
.unit-dot{width:12px;height:12px;border-radius:50%;flex:none}
/* ====== Modal ====== */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:12px}
.modal{background:var(--bg);border-radius:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px}
@media(min-width:600px){.modal-bg{align-items:center}}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{text-align:center;padding:10px 4px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700}
.badge .b{font-size:28px;display:block}
.badge.off{opacity:.35;filter:grayscale(1)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu .btn{flex-direction:column;padding:16px 10px;gap:4px}
.menu .btn span.i{font-size:28px}
.menu .btn small{font-weight:600;color:var(--muted);font-size:12px}
.signature{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:28px;color:var(--muted);font-style:italic;font-size:15px;opacity:.9}
.signature img{height:40px;width:auto;display:block}
.confetti{position:fixed;top:-10px;font-size:22px;pointer-events:none;animation:fall linear forwards;z-index:60}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app"></div>
<!--WORDS-->
<script src="words.js"></script>
<!--APP-->
<script src="app.js"></script>
</body>
</html>
